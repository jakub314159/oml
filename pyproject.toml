[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oml"
description = "machine learning optimisation"
authors = [
    {name = "Jakub Pietrzak"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
version = "0.0.1"

dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "click",
    "flask",
    "requests",
]

[project.optional-dependencies]

test = ["pytest", "pytest-cov", "pytest-mock", "pytest-html"]

code-check = ["black", "pylint"]

docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

dev = [
    "oml[test]",
    "oml[docs]",
    "oml[code-check]",
    "pre-commit",
]

ci = [
    "oml[test]",
    "oml[code-check]",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["oml*"]
namespaces = false

[tool.black]
line-length = 120

[tool.pylint]
max-line-length = 120
max-args = 8
max-positional-arguments = 6
disable = [
    "C0103", #snake case naming style
    "missing-module-docstring",
    "too-few-public-methods",
    "consider-using-generator",
    "use-a-generator",
    "too-many-instance-attributes",
]

[tool.coverage.run]
omit = [
    "oml/sql_connector.py"
]