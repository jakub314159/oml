[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oml"
description = "machine learning optimisation"
authors = [
    {name = "Jakub Pietrzak"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
version = "0.0.1"

dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
]

[project.optional-dependencies]

test = ["pytest", "pytest-cov"]

code-check = ["black"]

docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

dev = [
    "oml[test]",
    "oml[docs]",
    "oml[code-check]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["oml*"]
namespaces = false

[tool.black]
line-length = 120

[tool.pylint]
max-line-length = 120
disable = [
    "C0103", #snake case naming style
]